# STM32F103C CAN/UART Bootloader — OpenOCD configuration
# Used for initial JTAG/SWD programming of the bootloader.
#
# Supported probes (uncomment the one you are using):
#   - ST-Link V2 (most common for STM32 dev)
#   - J-Link
#   - CMSIS-DAP

# --- Probe (choose one) ---
source [find interface/stlink.cfg]
# source [find interface/jlink.cfg]
# source [find interface/cmsis-dap.cfg]

# --- Target ---
source [find target/stm32f1x.cfg]

# Slow down for first-time programming if needed:
# adapter speed 500

# Useful helpers:
proc flash_bootloader {} {
    program build/stm32f103c_bl.elf verify reset exit
}
