; PlatformIO project for building and uploading the STM32F103C bootloader.
;
; The bootloader's primary build system is GNU Make (firmware/Makefile).
; This config gives PlatformIO users (VSCode + PlatformIO IDE, mostly) a
; one-command workflow:
;
;   pio run                 ; build only
;   pio run -t upload       ; build and flash via ST-Link
;
; Both build systems produce equivalent output. Pre-built binaries are also
; committed in bin/ for users who want to skip building altogether.

[platformio]
src_dir = firmware

[env:stm32f103c_bootloader]
platform = ststm32
board = genericSTM32F103CB
framework = cmsis
upload_protocol = stlink
debug_tool = stlink

; FLASH @ 0x08000000, LENGTH 12 KB (bootloader region — application starts at 0x08003000).
board_build.ldscript = firmware/STM32F103CBTx_FLASH.ld

; Suppress the framework's CMSIS system_stm32f1xx.c and startup_stm32f103xb.s
; — we provide our own copies of both. Pointing these directives at
; non-existent filenames makes the framework include 0 sources (no error).
; See: platformio-ststm32/builder/frameworks/cmsis.py for the filter logic.
board_build.cmsis.system_file = __unused_system_file__.c
board_build.cmsis.startup_file = __unused_startup_file__.s

; Sources to compile (relative to src_dir = firmware/). We use our local
; copy of the STM32F1xx HAL drivers — same files the Makefile build uses —
; so both build systems are byte-equivalent. Our system_stm32f1xx.c calls
; PreSystemInit() from SystemInit() for the bootloader's fast-path boot.
build_src_filter =
    +<Core/Src/>
    +<Drivers/STM32F1xx_HAL_Driver/Src/>
    +<startup_stm32f103xb.s>

build_flags =
    -DSTM32F103xB
    -DUSE_HAL_DRIVER
    -Ifirmware/Core/Inc
    -Ifirmware/Drivers/STM32F1xx_HAL_Driver/Inc
    -Ifirmware/Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
    -Ifirmware/Drivers/CMSIS/Device/ST/STM32F1xx/Include
    -Ifirmware/Drivers/CMSIS/Include
    -Os
    -Wall
    -fdata-sections
    -ffunction-sections
    -std=c11
    -Wl,--gc-sections
